# ironet 内部维护的网络准入密钥。正常部署使用 `network create` 和邀请加入，
# 不要将其提交到公开配置仓库。
network_id = "REPLACE_WITH_RANDOM_NETWORK_ID"
identity_file = "/var/lib/ironet/identity.key"
# 可选的固定 iroh UDP 监听地址，适用于静态直连地址部署。
# bind_addresses = ["0.0.0.0:4000"]
# 当直连底层路径任一端点落入这些前缀时拒绝该路径。
# Yggdrasil 使用 200::/7；配置非 Ygg 路径或 relay 后可取消下一行注释。
# forbidden_underlay_prefixes = ["200::/7"]
# 所有 peer 都有固定直连地址且不需要外部发现时，设为 false。
discovery_enabled = true
# `none` 不创建 TUN，也不执行 ip route/sysctl；适用于无 CAP_NET_ADMIN 的
# LXC/Docker/VPS 纯中转节点。该模式必须启用 routing.transit_enabled，且不能
# 配置 node_addresses/advertised_prefixes。默认值为 `tun`。
attachment = "tun"
# 这是虚拟接口自动调整的上限，不是启动 MTU 或底层 MTU。接口从 1280
# 起步，只会在持续稳定的 LAN 路径上升高；遇到 WAN RTT、丢包或队列过期时
# 回到 1280。
tun_mtu = 65535
# 自动帧大小的安全上限。QUIC 从 1400 字节 UDP 负载开始；检测到 MTU 黑洞时，
# 自动回退到 1200 字节的安全下限。
max_frame_size = 1400
node_interface = "ironet0"

# 配置到 ironet0 虚拟接口的稳定节点/管理地址。
node_addresses = [
  "21.0.0.1/32",
  "21::1/128",
]

# 由当前路由器发布的 LAN 或服务前缀。
advertised_prefixes = [
  "192.168.10.0/24",
]

# 容量按（目的所有者，首跳）测量；节点不声明上下行带宽。
# 内置覆盖 trace 协议返回的元数据。trace 自动使用 node_addresses 中每个
# 地址族的第一个地址；CLI 会输出任意元数据。
[node_info]
name = "branch-a"
description = "Example branch router"

[node_info.metadata]
site = "example-site"

# IPv4、IPv6 直连路径会同时建立并持续测量；一次只激活其中一条。
# 偏好仅在健康度、丢包和 RTT 接近时生效，明显更好的另一地址族仍会被选择。
[path_selection]
prefer = "ipv6"

[relay]
# 默认禁止 iroh relay；直连 UDP、DERP 和已连接覆盖节点中转不受影响。
iroh_relay_enabled = false
# discovery_enabled = true 时继续发布 host、UPnP/PCP/NAT-PMP 和 peer 观察到的
# NAT 候选；iroh relay 关闭不影响直连和连接内的候选交换。
# discovery_urls = ["https://qad-1.example.net", "https://qad-2.example.net"]
# DERP 服务器列表为空时不建立 DERP 自定义传输。
# servers = ["https://derp-1.example.net/derp", "https://derp-2.example.net/derp"]
# 显式开启后才能配置自建 iroh relay URL；至少两个，并可与 DERP 并行。
# urls = ["https://relay-1.example.net", "https://relay-2.example.net"]

[routing]
isolate_overlay = true
# 允许在覆盖 peer 之间转发。它不控制 peer 访问本节点，
# 也不控制 peer 访问本节点发布的 LAN/服务前缀。
transit_enabled = false
rule_priority = 10000
table = 211
allow_default_routes = false
# 默认对来自覆盖网络、发往本节点 advertised_prefixes 的流量做源 NAT。
nat_enabled = true
# 可选的仅本机策略上限，不会通过 Presence 传播。
# max_egress_mbps = 80

# 从配置的引导 peer 学到的签名 Presence 会填充节点目录。已配置和自动
# 建立的活动邻接总数不超过 max_peers；其余条目仅保留为低成本目录记录，
# 并按直连可达性、RTT EWMA、丢包、稳定性和路径多样性筛选。
[mesh]
enabled = true
max_peers = 12

[packet_policy]
enforce_overlay_prefixes = true

# 可选的系统化 Reed-Solomon 数据报保护。即使本端发送 FEC 已关闭，
# 接收端也可以解析该封装。
[fec]
enabled = false
data_shards = 8
recovery_shards = 2
block_timeout_millis = 20
decoder_ttl_millis = 2000

[observability]
status_file = "/run/ironet/status.json"
metrics_file = "/run/ironet/metrics.prom"
report_interval_secs = 10

# 只添加引导/固定邻居（例如一个或两个公共节点）。其他成员通过签名
# Presence gossip 学习，并可能自动成为受限数量的直连 mesh 邻居。
#
# [[peers]]
# name = "branch-b"
# endpoint_id = "REPLACE_WITH_64_HEX_IROH_ENDPOINT_ID"
# mesh 开启时，签名 Presence 提供动态前缀和中转信息。
# transit_enabled = false
# relay_urls = ["https://relay-a.example.com", "https://relay-b.example.com"]
# 当 relay.servers 非空时，设置该 peer 单独生成的 DERP 密钥：
# derp_public_key = "REPLACE_WITH_64_HEX_DERP_PUBLIC_KEY"
# direct_addresses = ["203.0.113.10:4433"]
# mesh 开启时此静态源清单可省略：远端签名 Presence 会携带所有者前缀
# 和中转能力。
# allowed_source_prefixes = ["21.0.0.2/32", "21::2/128"]

# 私有点到点承载（IEPL/IPLC/内网交付/端口转发）使用 pairwise link contract。
# 下面的地址只存在于本机配置，不会写入签名 NodeRecord、Presence 或候选交换。
# 对应 peer 不再填写 direct_addresses、relay_urls 或 derp_public_key。
# [[links]]
# id = "iepl-ab-01"
# name = "iepl-ab"
# peer_id = "REPLACE_WITH_64_HEX_IROH_ENDPOINT_ID"
# class = "private-circuit"
# visibility = "pairwise"
# dial = "active" # 对端填 passive，或双方均使用 auto
# exclusive = true
# fallback = false
# local_bind = "10.255.0.1:4000"
# remote_addresses = ["10.255.0.2:4000"]
# allowed_local_prefixes = ["10.255.0.1/32"]
# allowed_remote_prefixes = ["10.255.0.2/32"]
# auth_key = "REPLACE_WITH_64_HEX_PAIRWISE_SECRET"

# 静态远端路由不写入本文件。使用 `ironet route add/import` 管理
# identity_file 同目录的 routes.toml；`route list/remove` 可查询和删除。
