[package]
name = "iroh-sdwan"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Demand-aware Linux overlay network using iroh and a single FlowRouter TUN"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.6"
bytes = "1.11.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
crypto_box = { version = "0.9.1", features = ["rand_core", "std"] }
hex = "0.4.3"
futures-util = "0.3.33"
ipnet = { version = "2.12.1", features = ["serde"] }
iroh = { version = "1.0.3", features = ["unstable-custom-transports"] }
iroh-base = "1.0.3"
noq-proto = "1.1.1"
n0-watcher = "1.0.0"
noq-udp = "1.1.1"
reed-solomon-simd = "3.1.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
socket2 = "0.6.1"
tokio = { version = "1.53.1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
tokio-util = "0.7.19"
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tun-rs = { version = "2.8.8", features = ["async_tokio"] }
url = "2.5.8"
webpki-roots = "1.0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
